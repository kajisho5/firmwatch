# 定期チェック：メーカー・OS の公開情報を読み、新しいバージョンを通知する
# 6時間ごとに取得、毎時15分に「あとで見る」のまとめ通知だけを確認する
name: 定期チェック
on:
  schedule:
    - cron: "5 */6 * * *"
    - cron: "15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: check, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=optional
      - name: チェックして通知
        env:
          FIRMWATCH_URL: ${{ vars.FIRMWATCH_URL }}
          FIRMWATCH_INTERNAL_TOKEN: ${{ secrets.FIRMWATCH_INTERNAL_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://github.com/${{ github.repository }}
        run: |
          if [ -z "$FIRMWATCH_URL" ]; then echo "まだ公開されていないので何もしません"; exit 0; fi
          if [ "${{ github.event.schedule }}" = "15 * * * *" ]; then node checker/run.mjs --digest; else node checker/run.mjs; fi
