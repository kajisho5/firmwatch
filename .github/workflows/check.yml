# 定期チェック：メーカー・OS の公開情報を読み、新しいバージョンを通知する
# 6時間ごとに取得、毎時15分に「あとで見る」のまとめ通知だけを確認する
# 本人確認は GitHub Actions の証明（OIDC）で行うので、鍵を作って入れる必要はない
name: 定期チェック
on:
  schedule:
    - cron: "5 */6 * * *"
    - cron: "15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency: { group: check, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: ブラウザを用意（Shure の一覧を表示して読むため）
        run: test -x /usr/bin/google-chrome || npx playwright install --with-deps chromium
      - name: 公開先の URL を調べる
        id: url
        env:
          FIXED_URL: ${{ vars.FIRMWATCH_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$FIXED_URL" ]; then echo "url=$FIXED_URL" >> $GITHUB_OUTPUT; exit 0; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "まだ公開されていないので何もしません"; exit 0; fi
          SUB=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).result.subdomain||'')}catch{console.log('')}})")
          if [ -z "$SUB" ]; then echo "公開先の URL が分かりませんでした"; exit 1; fi
          echo "url=https://firmwatch.$SUB.workers.dev" >> $GITHUB_OUTPUT
      - name: チェックして通知
        if: steps.url.outputs.url != ''
        env:
          FIRMWATCH_URL: ${{ steps.url.outputs.url }}
          VAPID_SUBJECT: https://github.com/${{ github.repository }}
        run: |
          if [ "${{ github.event.schedule }}" = "15 * * * *" ]; then node checker/run.mjs --digest; else node checker/run.mjs; fi
